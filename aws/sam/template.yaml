AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aloy - an Alexa skill that fetches TODOs from GitHub and summarizes them via Bedrock.

Parameters:
  GHPersonalAccessToken:
    Type: String
    NoEcho: true
    Description: GitHub PAT with read-only Contents access to the TODO repo.
  GHTodoRepoOwner:
    Type: String
    Description: Owner of the GitHub repo housing the TODO files.
  GHTodoRepoName:
    Type: String
    Description: Name of the GitHub repo housing the TODO files.
  AlexaSkillId:
    Type: String
    Default: ""
    Description: >
      (Optional) Alexa Skill ID to restrict invocation to. Leave blank for the
      first deploy (before the skill exists), then redeploy with it set.

Conditions:
  HasSkillId: !Not [!Equals [!Ref AlexaSkillId, ""]]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:
  AloyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # Custom build so we can assemble aws/lambda/function.py + src/aloy side
      # by side, matching the "from src.aloy..." imports used throughout the repo
      BuildMethod: makefile
    Properties:
      # Repo root, so the Makefile/Taskfile's paths (aws/lambda/..., src/...) resolve
      CodeUri: ../../
      FunctionName: aloy
      Handler: function.handler
      Environment:
        Variables:
          GH_PAT: !Ref GHPersonalAccessToken
          GH_TODO_REPO_OWNER: !Ref GHTodoRepoOwner
          GH_TODO_REPO_NAME: !Ref GHTodoRepoName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
      Events:
        Alexa:
          Type: AlexaSkill
          Properties:
            SkillId: !If [HasSkillId, !Ref AlexaSkillId, !Ref "AWS::NoValue"]

Outputs:
  AloyFunctionArn:
    Description: ARN to paste into the Alexa Developer Console as the skill's Lambda endpoint.
    Value: !GetAtt AloyFunction.Arn
