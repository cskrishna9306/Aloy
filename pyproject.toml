[project]
name = "aloy"
version = "0.1.0"
description = "Wakes up, checks my TODOs, tells me what matters! An Alexa skill + LLM summarizer for daily goals."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Tags / Keywords for PyPI discovery
keywords = [
	"alexa-skill",
	"LLM",
	"daily-motivator",
	"github",
]

# Constributors
authors = [
    { name = "Sai Chaparala", email = "cskrishna9306@gmail.com" }
]

# Project dependencies
dependencies = [
    "ask-sdk-core>=1.19.0",
    "boto3 (>=1.43.47,<2.0.0)",
    "langchain-aws>=1.6.4",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/cskrishna9306/Aloy"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
